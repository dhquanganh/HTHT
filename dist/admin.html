<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:,">
  <title>Quản trị · Hải Tặc Phục Sinh</title>
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="admin-heroes.css">
  <script defer src="admin.js"></script>
  <script defer src="admin-beast.js"></script>
  <script defer src="admin-events.js"></script>
  <script defer src="admin-raid.js"></script>
  <script defer src="admin-rewards.js"></script>
  <script defer src="admin-content.js"></script>
  <script defer src="admin-guild-boss.js"></script>
  <script defer src="admin-tower.js"></script>
  <script defer src="admin-album.js"></script>
  <script defer src="sprite-spine.js"></script>
  <script defer src="admin-heroes.js"></script>
  <script defer src="admin-gem.js"></script>
</head>
<body>
  <main id="login" class="card login" hidden>
    <h1>Quản trị</h1>
    <form id="login-form">
      <label>Mật khẩu quản trị <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Đăng nhập</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </main>
  <div id="app" hidden>
    <header><h1>Quản trị</h1><nav class="main-tabs" role="tablist" aria-label="Khu vực quản trị"><button id="tab-players" type="button" role="tab" aria-selected="true" class="ghost on">Tài khoản</button><button id="tab-beast" type="button" role="tab" aria-selected="false" class="ghost">Chiến Thần Thú</button><button id="tab-events" type="button" role="tab" aria-selected="false" class="ghost">Sự kiện</button><button id="tab-raid" type="button" role="tab" aria-selected="false" class="ghost">Chiến dịch</button><button id="tab-rewards" type="button" role="tab" aria-selected="false" class="ghost">Phần thưởng</button><button id="tab-stages" type="button" role="tab" aria-selected="false" class="ghost">Phụ bản</button><button id="tab-monsters" type="button" role="tab" aria-selected="false" class="ghost">Quái</button><button id="tab-guildboss" type="button" role="tab" aria-selected="false" class="ghost">Boss hạm đội</button><button id="tab-tower" type="button" role="tab" aria-selected="false" class="ghost">Leo tháp</button><button id="tab-album" type="button" role="tab" aria-selected="false" class="ghost">Tranh Người Cá</button><button id="tab-heroes" type="button" role="tab" aria-selected="false" class="ghost">Tạo nhân vật</button><button id="tab-gem" type="button" role="tab" aria-selected="false" class="ghost">Ngọc Vega</button></nav><button id="logout" class="ghost">Đăng xuất</button></header>
    <div id="beast-tab" class="beast-admin" hidden></div>
    <div id="events-tab" class="events-admin" hidden></div>
    <div id="raid-tab" class="events-admin" hidden></div>
    <div id="rewards-tab" class="events-admin" hidden></div>
    <div id="stages-tab" class="events-admin" hidden></div>
    <div id="monsters-tab" class="events-admin" hidden></div>
    <div id="guildboss-tab" class="events-admin" hidden></div>
    <div id="tower-tab" class="events-admin" hidden></div>
    <div id="album-tab" class="events-admin al-admin" hidden></div>
    <div id="heroes-tab" class="events-admin hc-admin" hidden></div>
    <div id="gem-tab" class="events-admin" hidden></div>
    <div class="columns" id="players-tab">
      <section class="card">
        <form id="search-form" class="row"><input id="search" type="search" placeholder="Tìm theo tên đăng nhập hoặc tên thuyền trưởng" aria-label="Tìm tài khoản"><button type="submit">Tìm</button></form>
        <p class="muted" id="result-count"></p>
        <div class="table"><table><thead><tr><th>Tài khoản</th><th>Cấp</th><th>Vàng</th><th>Kim cương</th><th>Ải</th><th>Đậu thần</th><th>Tướng</th><th>Hoạt động</th></tr></thead><tbody id="players"></tbody></table></div>
        <div class="row pager"><button id="previous" class="ghost" type="button">Trang trước</button><span id="page"></span><button id="next" class="ghost" type="button">Trang sau</button></div>
      </section>
      <section class="card" id="detail" hidden aria-live="polite"></section>
    </div>
  </div>
  <div id="toast" role="status"></div>
</body>
</html>
